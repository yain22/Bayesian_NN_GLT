<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" width="360" height="408" role="img" aria-labelledby="title desc">
  <title id="title">BNN GLT</title>
  <desc id="desc">A neural network inside a white hexagon. Three connections entering the highlighted neuron each carry a bell curve of a different width.</desc>

  <path d="M180 15 343.7 109.5v189L180 393 16.3 298.5v-189Z"
        fill="#fff" stroke="#244f70" stroke-width="10" stroke-linejoin="round"/>

  <!-- Each incoming coefficient, including the bias, has its own local scale. -->
  <g fill="none" stroke="#244f70" stroke-width="3.7" stroke-linecap="round">
    <path d="m79 120 99 95M79 172l99 43m-99 9 99-9"/>
    <path d="m178 128 102 44-102 43"/>
  </g>
  <g fill="none" stroke="#b35446" stroke-width="5.1" stroke-linecap="round">
    <path d="m79 120 99 8M79 172l99-44m-99 96 99-96"/>
  </g>
  <g fill="#fff" stroke="#244f70" stroke-width="4.5">
    <circle cx="79" cy="120" r="11.7"/>
    <circle cx="79" cy="172" r="11.7"/>
    <rect x="68.1" y="213.1" width="21.8" height="21.8" rx="2"/>
    <circle cx="178" cy="215" r="14"/>
    <circle cx="280" cy="172" r="14"/>
  </g>
  <path d="m75.4 222.4 4.3-3.1v9.6" fill="none" stroke="#244f70"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff8f3" stroke="#b35446" stroke-width="2.6" stroke-linejoin="round">
    <path transform="translate(118 123.2) rotate(4.6)" d="M-14 0 C-5 0 -5 -12 0 -12 S5 0 14 0 Z"/>
    <path transform="translate(123 152.4) rotate(-24)" d="M-10 0 C-3 0 -4 -14 0 -14 S3 0 10 0 Z"/>
    <path transform="translate(122 182.3) rotate(-44)" d="M-17 0 C-6 0 -5 -8 0 -8 S6 0 17 0 Z"/>
  </g>
  <circle cx="178" cy="128" r="16" fill="#fff8f3" stroke="#b35446" stroke-width="5"/>

  <!-- Geometric outlined lettering keeps the wordmark independent of local fonts. -->
  <g transform="translate(75 270)" fill="none" stroke-width="6.9"
     stroke-linecap="square" stroke-linejoin="round">
    <g stroke="#244f70">
      <path d="M0 0v36h14c7.3 0 11-3.5 11-9s-4-9-11-9H0m0-18h12.6c6.7 0 10.5 3.1 10.5 8.7S19.8 18 12.6 18"/>
